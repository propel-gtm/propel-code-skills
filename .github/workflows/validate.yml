name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skills and plugin metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SKILL frontmatter
        run: python .github/scripts/validate_skill_frontmatter.py

      - name: Validate plugin metadata
        run: python .github/scripts/validate_plugin_metadata.py

      - name: Validate install instructions
        run: python .github/scripts/validate_install_instructions.py

      - name: Validate SKILL docs and duplicated helpers
        run: python .github/scripts/validate_skill_docs_and_duplicates.py

      - name: Install test dependencies
        run: pip install pytest==8.4.2

      - name: Run shell unit tests
        run: |
          plugins/propel-code-review/skills/propel-code-review/scripts/test_poll_status_parsing.sh

      - name: Run helper script contract tests
        run: |
          pytest plugins/propel-code-review/skills/propel-code-review/scripts/tests/test_review_helper_contracts.py

      - name: Run CARL script tests
        run: |
          PYTHONPATH=plugins/propel-code-review/skills/carl/scripts \
          pytest plugins/propel-code-review/skills/carl/scripts/tests/test_post_carl_summary_comment.py
