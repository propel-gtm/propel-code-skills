name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint and syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.15.2

      - name: Run ruff
        run: |
          ruff check .github/scripts
          find plugins -path "*/scripts" -type d -print0 | xargs -0 --no-run-if-empty ruff check

      - name: Python syntax check
        run: |
          find plugins -path "*/scripts/*.py" -type f -print0 | xargs -0 --no-run-if-empty python -m py_compile
          find .github/scripts -name "*.py" -type f -print0 | xargs -0 --no-run-if-empty python -m py_compile
